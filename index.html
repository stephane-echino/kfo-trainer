<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KFO Trainer">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/app.css">
<title>KFO Trainer — DR400 Chair Flying</title>
</head>
<body>
<div id="app">

  <!-- ============ HOME ============ -->
  <section id="screen-home" class="screen active">
    <header class="home-header">
      <div class="home-title">
        <h1>KFO&nbsp;Trainer</h1>
        <p class="subtitle">Robin DR400 · HB-KFO · chair flying</p>
      </div>
      <button class="icon-btn" id="btn-settings" data-i18n-aria="aria.settings" aria-label="Settings">⚙︎</button>
    </header>

    <div class="course-switch" id="course-switch"></div>

    <div class="readiness" id="readiness">
      <div class="readiness-head">
        <span class="readiness-label" id="readiness-label"></span>
        <span class="readiness-pct" id="readiness-pct"></span>
      </div>
      <div class="readiness-track"><div class="readiness-fill" id="readiness-fill"></div></div>
      <div class="readiness-sub" id="readiness-sub"></div>
    </div>

    <div class="stats-strip" id="stats-strip"></div>


    <nav class="mode-list" id="mode-list">
      <button class="mode-card" data-mode="flight">
        <span class="mode-icon">🛫</span>
        <span class="mode-text">
          <span class="mode-name" data-i18n="mode.flight.name"></span>
          <span class="mode-desc" data-i18n="mode.flight.desc"></span>
        </span>
        <span class="mode-progress" id="progress-flight"></span>
      </button>
      <button class="mode-card" data-mode="examiner">
        <span class="mode-icon">🎓</span>
        <span class="mode-text">
          <span class="mode-name" data-i18n="mode.exam.name"></span>
          <span class="mode-desc" data-i18n="mode.exam.desc"></span>
        </span>
      </button>
      <button class="mode-card" data-mode="memory">
        <span class="mode-icon">🧠</span>
        <span class="mode-text">
          <span class="mode-name" data-i18n="mode.memory.name"></span>
          <span class="mode-desc" data-i18n="mode.memory.desc"></span>
        </span>
        <span class="mode-progress" id="progress-memory"></span>
      </button>
      <button class="mode-card" data-mode="review">
        <span class="mode-icon">🔁</span>
        <span class="mode-text">
          <span class="mode-name" data-i18n="mode.review.name"></span>
          <span class="mode-desc" data-i18n="mode.review.desc"></span>
        </span>
        <span class="mode-progress" id="progress-review"></span>
      </button>
      <button class="mode-card" data-mode="reference">
        <span class="mode-icon">📖</span>
        <span class="mode-text">
          <span class="mode-name" data-i18n="mode.ref.name"></span>
          <span class="mode-desc" data-i18n="mode.ref.desc"></span>
        </span>
      </button>
    </nav>

    <div class="conditions-bar">
      <div class="conditions-chips" id="conditions-chips"></div>
      <button class="dice-btn" id="btn-randomize" aria-label="Random conditions">🎲</button>
    </div>
    <div class="phase-jump">
      <h2 data-i18n="home.jump"></h2>
      <div class="phase-chips collapsed" id="phase-chips"></div>
      <button class="phase-more" id="btn-phase-more"></button>
    </div>

    <button class="badges-row" id="badges-row"></button>
    <footer class="home-footer">
      <button class="version-line" id="app-version"></button>
      <button class="update-btn" id="btn-update" data-i18n="update.check"></button>
      <p class="disclaimer" data-i18n="home.disclaimer"></p>
    </footer>
  </section>

  <!-- ============ ACHIEVEMENTS ============ -->
  <section id="screen-achievements" class="screen">
    <header class="trainer-header">
      <button class="icon-btn" id="btn-ach-back" data-i18n-aria="aria.back" aria-label="Back">←</button>
      <div class="trainer-phase-info">
        <div class="trainer-phase-title" data-i18n="achievements.title"></div>
      </div>
      <span class="icon-btn" style="visibility:hidden">·</span>
    </header>
    <main class="ref-area" id="ach-area"></main>
  </section>

  <!-- ============ CHANGELOG ============ -->
  <section id="screen-changelog" class="screen">
    <header class="trainer-header">
      <button class="icon-btn" id="btn-changelog-back" data-i18n-aria="aria.back" aria-label="Back">←</button>
      <div class="trainer-phase-info">
        <div class="trainer-phase-title" data-i18n="changelog.title"></div>
      </div>
      <span class="icon-btn" style="visibility:hidden">·</span>
    </header>
    <main class="ref-area" id="changelog-area"></main>
  </section>

  <!-- ============ TRAINER ============ -->
  <section id="screen-trainer" class="screen">
    <header class="trainer-header">
      <button class="icon-btn" id="btn-trainer-back" data-i18n-aria="aria.back" aria-label="Back">←</button>
      <div class="trainer-phase-info">
        <div class="trainer-phase-title" id="trainer-phase-title">—</div>
        <div class="trainer-context" id="trainer-context"></div>
      </div>
      <button class="icon-btn" id="btn-handsfree" data-i18n-aria="aria.handsfree" aria-label="Hands-free">🎧</button>
      <button class="icon-btn" id="btn-voice-toggle" data-i18n-aria="aria.voice" aria-label="Voice check">🎙︎</button>
    </header>

    <div class="streak-chip" id="streak-chip"></div>
    <div class="timer-chip hidden" id="timer-chip"></div>
    <div class="circuit-wrap" id="circuit-wrap"></div>

    <div class="progress-track"><div class="progress-fill" id="trainer-progress"></div></div>

    <main class="step-area" id="step-area">
      <div class="step-card" id="step-card">
        <div class="step-badges">
          <span class="step-kind" id="step-kind"></span>
          <span class="step-mem hidden" id="step-mem"></span>
          <span class="step-source hidden" id="step-source"></span>
        </div>
        <div class="step-block-title" id="step-block-title"></div>
        <div class="step-prompt" id="step-prompt"></div>
        <div class="rpm-control hidden" id="rpm-control">
          <div class="rpm-readout" id="rpm-readout">1000</div>
          <div class="rpm-unit">RPM</div>
          <input type="range" id="rpm-slider" min="500" max="2700" step="50" value="1000">
          <div class="rpm-scale"><span>500</span><span>1600</span><span>2700</span></div>
          <button class="rpm-set" id="rpm-set" data-i18n="rpm.set"></button>
        </div>
        <div class="step-answer hidden" id="step-answer"></div>
        <div class="step-spoken hidden" id="step-spoken"></div>
        <div class="step-note hidden" id="step-note"></div>
        <div class="state-hint hidden" id="state-hint"></div>
        <div class="voice-feedback hidden" id="voice-feedback"></div>
        <div class="step-clue hidden" id="step-clue"></div>
        <div class="step-hint" id="step-hint"></div>
        <button class="clue-btn hidden" id="btn-clue" data-i18n="clue.ask"></button>
      </div>
    </main>

    <footer class="trainer-actions">
      <button class="action-btn ghost" id="btn-step-prev" data-i18n="btn.prev"></button>
      <button class="action-btn miss" id="btn-step-miss" data-i18n="btn.miss"></button>
      <button class="action-btn ok" id="btn-step-ok" data-i18n="btn.ok"></button>
    </footer>
  </section>

  <!-- ============ EXAMINER ============ -->
  <section id="screen-examiner" class="screen">
    <header class="trainer-header">
      <button class="icon-btn" id="btn-exam-back" data-i18n-aria="aria.back" aria-label="Back">←</button>
      <div class="trainer-phase-info">
        <div class="trainer-phase-title" data-i18n="exam.title"></div>
        <div class="trainer-context" id="exam-score">—</div>
      </div>
      <span class="icon-btn" style="visibility:hidden">·</span>
    </header>
    <main class="step-area">
      <div class="step-card" id="exam-card">
        <div class="step-badges">
          <span class="step-kind" id="exam-kind"></span>
          <span class="step-source hidden" id="exam-source"></span>
        </div>
        <div class="step-block-title" id="exam-tag"></div>
        <div class="step-prompt" id="exam-question"></div>
        <div class="step-answer hidden" id="exam-answer"></div>
        <div class="step-hint" id="exam-hint" data-i18n="exam.hint"></div>
      </div>
    </main>
    <footer class="trainer-actions">
      <button class="action-btn ghost" id="btn-exam-quit" data-i18n="exam.end"></button>
      <button class="action-btn miss" id="btn-exam-miss" data-i18n="btn.miss"></button>
      <button class="action-btn ok" id="btn-exam-ok" data-i18n="btn.ok"></button>
    </footer>
  </section>

  <!-- ============ REFERENCE ============ -->
  <section id="screen-reference" class="screen">
    <header class="trainer-header">
      <button class="icon-btn" id="btn-ref-back" data-i18n-aria="aria.back" aria-label="Back">←</button>
      <div class="trainer-phase-info">
        <div class="trainer-phase-title" data-i18n="ref.title"></div>
      </div>
      <span class="icon-btn" style="visibility:hidden">·</span>
    </header>
    <div class="ref-search-wrap">
      <input type="search" id="ref-search" class="ref-search" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <main class="ref-area" id="ref-area"></main>
  </section>

  <!-- ============ SETTINGS ============ -->
  <section id="screen-settings" class="screen">
    <header class="trainer-header">
      <button class="icon-btn" id="btn-settings-back" data-i18n-aria="aria.back" aria-label="Back">←</button>
      <div class="trainer-phase-info">
        <div class="trainer-phase-title" data-i18n="settings.title"></div>
      </div>
      <span class="icon-btn" style="visibility:hidden">·</span>
    </header>
    <main class="settings-area">
      <div class="setting-row">
        <span data-i18n="settings.lang" data-i18n-small="settings.langSmall"></span>
        <div class="lang-switch">
          <button class="lang-btn" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="fr">FR</button>
        </div>
      </div>

      <h3 class="settings-group-title" data-i18n="settings.trainGroup"></h3>
      <div class="setting-row" style="flex-direction:column;align-items:stretch;gap:10px">
        <span data-i18n="settings.train" data-i18n-small="settings.trainSmall"></span>
        <div class="train-toggles" id="train-toggles">
          <button class="train-toggle" data-type="checklist" data-i18n="block.checklist"></button>
          <button class="train-toggle" data-type="flow" data-i18n="block.flow"></button>
          <button class="train-toggle" data-type="callout" data-i18n="block.callout"></button>
          <button class="train-toggle" data-type="briefing" data-i18n="block.briefing"></button>
          <button class="train-toggle" data-type="radio" data-i18n="block.radio"></button>
          <button class="train-toggle" data-type="note" data-i18n="block.note"></button>
        </div>
      </div>

      <h3 class="settings-group-title" data-i18n="settings.otherGroup"></h3>
      <label class="setting-row">
        <span data-i18n="settings.voice" data-i18n-small="settings.voiceSmall"></span>
        <input type="checkbox" id="set-voice">
      </label>
      <label class="setting-row">
        <span data-i18n="settings.speak" data-i18n-small="settings.speakSmall"></span>
        <input type="checkbox" id="set-speak">
      </label>
      <label class="setting-row">
        <span data-i18n="settings.wake" data-i18n-small="settings.wakeSmall"></span>
        <input type="checkbox" id="set-wakelock">
      </label>
      <label class="setting-row">
        <span data-i18n="settings.haptics" data-i18n-small="settings.hapticsSmall"></span>
        <input type="checkbox" id="set-haptics">
      </label>
      <label class="setting-row">
        <span data-i18n="settings.controls" data-i18n-small="settings.controlsSmall"></span>
        <input type="checkbox" id="set-controls">
      </label>
      <div class="setting-row">
        <span data-i18n="settings.reset" data-i18n-small="settings.resetSmall"></span>
        <button class="action-btn ghost" id="btn-reset-progress" data-i18n="settings.resetBtn"></button>
      </div>
      <div class="setting-row">
        <span data-i18n="settings.clear" data-i18n-small="settings.clearSmall"></span>
        <button class="action-btn ghost" id="btn-reset-misses" data-i18n="settings.clearBtn"></button>
      </div>
      <div class="setting-row">
        <span data-i18n="settings.stats" data-i18n-small="settings.statsSmall"></span>
        <button class="action-btn ghost" id="btn-reset-stats" data-i18n="settings.statsBtn"></button>
      </div>
      <p class="settings-note" id="voice-support-note"></p>
    </main>
  </section>

</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
